<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kamal Billing Pro{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <span class="brand-icon">🏪</span>
      <span>
        Kamal Billing Pro
        <span class="brand-sub">Kamal Cloth House</span>
      </span>
    </a>
    <ul class="navbar-nav">
      <li><a href="/" class="{% block nav_home %}{% endblock %}">🧾 New Bill</a></li>
      <li><a href="/history" class="{% block nav_history %}{% endblock %}">📋 History</a></li>
    </ul>
  </nav>

  <!-- ===== Page Content ===== -->
  <main class="page-wrapper">
    {% block content %}{% endblock %}
  </main>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    &copy; 2025 Kamal Cloth House &nbsp;·&nbsp; Kamal Billing Pro
  </footer>

</body>
</html>
